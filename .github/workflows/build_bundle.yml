# Builds one Blender extension zip per platform (windows_x64, linux_x64,
# macos_arm64, macos_x64). Each zip bundles the matching pysuperluxcore wheel
# (fetched from the engine repo's `wheels-latest` release, or another tag) so
# it installs and runs offline; the Windows and Linux zips also bundle the
# hash-pinned NVRTC wheel that CUDA/OptiX needs (see
# cmake/bundled-wheels-{win,linux}.txt).

name: SuperLuxCore Build Bundle

on:
  pull_request:
  workflow_call:
    inputs:
      build_type:
        required: false
        type: string
        default: "Latest"
      wheels_tag:
        description: "Engine release tag to take wheels from"
        required: false
        type: string
        default: "wheels-latest"
    outputs:
      commit:
        description: "The commit that has been checked out"
        value: ${{ jobs.build-bundle.outputs.commit }}
      branch:
        description: "The branch that has been checked out"
        value: ${{ jobs.build-bundle.outputs.branch }}
      attestation-url:
        description: "The url to the attestations"
        value: ${{ jobs.attest-bundle.outputs.attestation-url }}
  workflow_dispatch:
    inputs:
      build_type:
        required: true
        type: string
        default: "Release"
      wheels_tag:
        description: "Engine release tag to take wheels from"
        required: false
        type: string
        default: "wheels-latest"

env:
  ENGINE_REPO: claudianus/SuperLuxCore
  BUILD_TYPE: ${{ inputs.build_type || 'Release' }}
  WHEELS_TAG: ${{ inputs.wheels_tag || 'wheels-latest' }}

jobs:
  build-bundle:
    name: Build bundle
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.current-commit.outputs.commit }}
      branch: ${{ steps.current-commit.outputs.branch }}

    steps:

      - name: Checkout main repository
        uses: actions/checkout@v6

      - name: Get current commit
        id: current-commit
        run: |
          echo "commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "branch=$(git symbolic-ref HEAD)" >> $GITHUB_OUTPUT
          echo "commit=$(git rev-parse HEAD)"
          echo "branch=$(git symbolic-ref HEAD)"

      - name: Set up cmake
        uses: lukka/get-cmake@latest

      # tomllib (cmake/superluxcore_version.py, cmake/verify_bundle.py) needs >= 3.11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Blender's Linux binary links against these even for headless `--command` runs
      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libxi6 libxxf86vm1 libxfixes3 libxkbcommon0 libgl1 libsm6 libxrender1

      - name: Download Blender
        shell: bash
        run: |
          set -euo pipefail

          BLENDER_VERSION="5.2"
          BLENDER_VERSION_PATCH=".1"
          BLENDER_URL="https://download.blender.org/release/Blender${BLENDER_VERSION}/blender-${BLENDER_VERSION}${BLENDER_VERSION_PATCH}-linux-x64.tar.xz"
          INSTALL_DIR="$HOME/.local/opt/blender-${BLENDER_VERSION}"
          BIN_DIR="$HOME/.local/bin"

          mkdir -p "$INSTALL_DIR" "$BIN_DIR"

          echo "Downloading Blender ${BLENDER_VERSION} LTS..."
          wget -q --show-progress -O /tmp/blender.tar.xz "$BLENDER_URL"

          echo "Extracting Blender to ${INSTALL_DIR}..."
          tar -xf /tmp/blender.tar.xz -C "$INSTALL_DIR" --strip-components=1

          rm /tmp/blender.tar.xz

          echo "Creating symlink in ${BIN_DIR}..."
          ln -sf "${INSTALL_DIR}/blender" "${BIN_DIR}/blender"

          echo "Blender ${BLENDER_VERSION} installed successfully!"

          echo "BLENDER_ROOT=${INSTALL_DIR}" >> $GITHUB_ENV

      # CUDA is never exercised on the macOS dev machines nor on GPU-less CI,
      # so a CUDA-only kernel compile error ships unnoticed (v2.11.21: no
      # Windows/Linux NVIDIA render at all). Before bundling, compile the
      # engine kernels the wheels were built from with the NVRTC we ship.
      - name: Resolve engine commit of the wheels tag
        id: engine
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/${ENGINE_REPO}/commits/${WHEELS_TAG}" --jq .sha)
          echo "Engine wheels ${WHEELS_TAG} -> ${ENGINE_REPO}@${sha}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Checkout engine sources at the wheels commit
        uses: actions/checkout@v6
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ steps.engine.outputs.sha }}
          path: engine-src
          sparse-checkout: |
            include
            src
            dev-tools

      - name: CUDA kernel compile gate (bundled NVRTC)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f engine-src/dev-tools/cuda_kernel_check.py ]; then
            echo "::error::${ENGINE_REPO}@${{ steps.engine.outputs.sha }} has no dev-tools/cuda_kernel_check.py - refusing to bundle unchecked CUDA kernels"
            exit 1
          fi
          python -m pip install --require-hashes --no-deps -r cmake/bundled-wheels-linux.txt
          python engine-src/dev-tools/cuda_kernel_check.py --repo engine-src --jobs 4
          # Keep the engine checkout out of the add-on bundle.
          rm -rf engine-src

      # pysuperluxcore is NOT on PyPI: without bundled wheels the extension
      # would try (and fail) to `pip download` it at first launch.
      - name: Fetch engine wheels (cp313)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKED_SHA: ${{ steps.engine.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p wheels
          gh release download "${WHEELS_TAG}" -R "${ENGINE_REPO}" \
            -p 'pysuperluxcore-*-cp313-cp313-*.whl' -D wheels --clobber
          ls -l wheels
          # wheels-latest is a moving tag: the wheels must be the ones whose
          # kernels were just compiled.
          now=$(gh api "repos/${ENGINE_REPO}/commits/${WHEELS_TAG}" --jq .sha)
          if [ "${now}" != "${CHECKED_SHA}" ]; then
            echo "::error::${WHEELS_TAG} moved from ${CHECKED_SHA} to ${now} during the build - rerun"
            exit 1
          fi

      # Blender does not resolve wheel dependencies; without NVRTC the CUDA
      # backend fails to initialise. --require-hashes verifies the download
      # against the hash committed in the requirements file.
      - name: Fetch NVRTC wheel (Windows, hash-pinned)
        shell: bash
        run: |
          python -m pip download --require-hashes --no-deps --only-binary=:all: \
            --platform win_amd64 --python-version 3.13 --implementation cp \
            -d wheels -r cmake/bundled-wheels-win.txt
          ls -l wheels

      - name: Fetch NVRTC wheel (Linux, hash-pinned)
        shell: bash
        run: |
          python -m pip download --require-hashes --no-deps --only-binary=:all: \
            --platform manylinux2014_x86_64 --python-version 3.13 --implementation cp \
            -d wheels -r cmake/bundled-wheels-linux.txt
          ls -l wheels

      - name: Package bundle
        shell: bash
        run: |
          build_dir="${{ github.workspace }}/build"
          mkdir ${build_dir}
          echo "Configure"
          cmake \
            -B ${build_dir} \
            -S . \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DBLC_BUNDLE_WHEELS=ON \
            -DBLENDER_ROOT=${BLENDER_ROOT} \
            -Dblender_ROOT=${BLENDER_ROOT}

          echo "Build"
          cmake --build ${build_dir}

      - name: Verify bundles
        run: python cmake/verify_bundle.py "${{ github.workspace }}/build/out"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        id: upload
        with:
          name: "SuperLuxCore"
          path: "${{ github.workspace }}/build/out/SuperLuxCore-*.zip"
          if-no-files-found: error

  attest-bundle:
    needs: [build-bundle]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      id-token: write
    outputs:
      attestation-url: ${{ steps.attestation-step.outputs.attestation-url }}

    steps:
      - uses: actions/download-artifact@v7
        if: ${{ !env.ACT }}
        with:
          name: "SuperLuxCore"
          path: ${{ github.workspace }}/dist

      - name: Generate artifact attestations
        id: attestation-step
        if: ${{ !env.ACT }}
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ github.workspace }}/dist/*.zip
