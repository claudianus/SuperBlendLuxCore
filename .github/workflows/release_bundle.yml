# Automatic release: pushing a `vMAJOR.MINOR.PATCH[-pre]` tag builds the
# per-platform extension zips (engine wheels bundled) and publishes them as a
# GitHub release. Manual runs (workflow_dispatch) create a *draft* release.
#
#   git tag v2.11.3 && git push origin v2.11.3
#
# The tag must match `version` in blender_manifest.toml.

name: SuperLuxCore Create Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      release-version:
        description: "Release version (major.minor.patch[-pre])"
        required: True
        default: ''
        type: string
      allow-updates:
        description: "Update existing release (if any)"
        required: True
        type: boolean
        default: False
      wheels-tag:
        description: "Engine release tag to take wheels from"
        required: False
        type: string
        default: "wheels-latest"

jobs:
  check-version:
    name: 'Check version compliance'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v6

      - name: Resolve and check version compliance
        id: resolve
        shell: python
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.release-version }}
        run: |
          import os
          import sys
          import re
          import tomllib

          if os.environ["EVENT_NAME"] == "push":
              version = os.environ["REF_NAME"].removeprefix("v")
          else:
              version = os.environ["INPUT_VERSION"]

          # Check semver compliance
          semver_regex = r"^(?P<major>0|[1-9]\d*)\.(?P<minor>0|[1-9]\d*)\.(?P<patch>0|[1-9]\d*)(?:-(?P<prerelease>(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+(?P<buildmetadata>[0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$"
          res = re.fullmatch(semver_regex, version)
          if not res:
              message = [
                  f"::error::INVALID RELEASE VERSION NUMBER '{version}' (SEMVER ERROR)",
                  "Version must comply to Semantic Versioning standard:",
                  "\n\tmajor.minor.patch[-pre]\n",
                  "See https://semver.org for more information",
              ]
              print("\n".join(message))
              sys.exit(1)

          # Check blender_manifest consistency
          with open("blender_manifest.toml", "rb") as f:
              manifest = tomllib.load(f)
              manifest_version = manifest["version"]
              if version != manifest_version:
                  message = [
                      f"::error::INVALID RELEASE VERSION NUMBER '{version}' (BLENDER MANIFEST ERROR)\n",
                      "Requested version is different from manifest version ",
                      "set in `blender_manifest.toml` file ",
                      f"('{manifest_version}')\n",
                  ]
                  print("".join(message))
                  sys.exit(1)

          # Success
          print(f"::notice::Version number OK ('{version}')")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={version}\n")

      - name: Check add-on/engine version lockstep
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE_REPO: claudianus/SuperLuxCore
          ADDON_VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          import base64, json, os, subprocess, sys, tempfile
          from pathlib import Path

          # The bundle gate (cmake/verify_bundle.py) catches an engine wheel
          # whose version disagrees with the add-on, but only after the whole
          # bundle is built. Fetch the engine settings and fail here instead.
          raw = subprocess.run(
              [
                  "gh", "api",
                  f"repos/{os.environ['ENGINE_REPO']}/contents/"
                  "build-system/build-settings.json",
                  "--jq", ".content",
              ],
              check=True, capture_output=True, text=True,
              env={**os.environ, "GH_TOKEN": os.environ["GH_TOKEN"]},
          ).stdout

          with tempfile.TemporaryDirectory() as tmp:
              engine = Path(tmp) / "engine"
              (engine / "build-system").mkdir(parents=True)
              (engine / "build-system" / "build-settings.json").write_bytes(
                  base64.b64decode(raw)
              )
              result = subprocess.run(
                  [
                      sys.executable,
                      "dev-tools/check_version_lockstep.py",
                      "--engine", str(engine),
                  ]
              )
          if result.returncode != 0:
              print(
                  f"::error::engine version on {os.environ['ENGINE_REPO']} does "
                  f"not match add-on {os.environ['ADDON_VERSION']} - bump both "
                  "with dev-tools/check_version_lockstep.py --set <version>"
              )
          sys.exit(result.returncode)

  call-build-bundle:
    name: 'Build SuperLuxCore Bundle'
    needs: [check-version]
    uses: ./.github/workflows/build_bundle.yml
    with:
      build_type: Release
      wheels_tag: ${{ inputs.wheels-tag || 'wheels-latest' }}
    permissions:
      contents: read
      id-token: write
      attestations: write

  create-release:
    name: 'Create release'
    runs-on: ubuntu-latest
    needs: [check-version, call-build-bundle]
    permissions:
      id-token: write
      attestations: write
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - run: |
          echo "Creating release '${RELEASE_VERSION}'"
          echo "RELEASE_TAG=v${RELEASE_VERSION}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
      - run: mkdir ${{ github.workspace }}/dist
      - uses: actions/download-artifact@v7
        with:
          name: "SuperLuxCore"
          path: ${{ github.workspace }}/dist

      - name: Display structure of downloaded files
        run: ls -Rl ${{ github.workspace }}/dist

      - id: make-release
        # Use full length commit SHA, otherwise CodeQL complains...
        uses: ncipollo/release-action@cdcc88a9acf3ca41c16c37bb7d21b9ad48560d87
        with:
          name: "SuperLuxCore ${{ env.RELEASE_TAG }}"
          tag: ${{ env.RELEASE_TAG }}
          artifacts: ${{ github.workspace }}/dist/*.zip
          removeArtifacts: true
          allowUpdates: ${{ github.event_name == 'push' || inputs.allow-updates }}
          draft: ${{ github.event_name != 'push' }}
          token: ${{ secrets.GITHUB_TOKEN }}
          updateOnlyUnreleased: true
          body: |
            ## SuperLuxCore

            Install via **Edit > Preferences > Get Extensions > Install from Disk**
            (pick the zip for your platform). The engine wheel is bundled, so
            no download or pip is needed. The Windows zip also bundles the
            NVRTC wheel required by the CUDA/OptiX backend.

            Headless / unattended install (the `-e` flag is what enables
            the extension; without it Blender only unpacks the zip):

                blender --command extension install-file \
                    -r user_default -e SuperLuxCore-<version>-<platform>.zip

            - `windows_x64` - Windows 10/11 x64 (NVIDIA CUDA/OptiX + OpenCL)
            - `linux_x64`, `macos_arm64`, `macos_x64`

            This release was built from the following point in claudianus/SuperBlendLuxCore:
            - Branch: ${{ needs.call-build-bundle.outputs.branch }}
            - Commit: ${{ needs.call-build-bundle.outputs.commit }}

            Attestations:
            ${{ needs.call-build-bundle.outputs.attestation-url }}

      - run: |
          echo "### Release""" >> $GITHUB_STEP_SUMMARY
          echo ${{ steps.make-release.outputs.html_url }} >> $GITHUB_STEP_SUMMARY
