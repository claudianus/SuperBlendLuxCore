</style></head><body><main class="wrap"><p><b>한국어</b> · <a href="../index.html" lang="en">English</a></p><h1>SuperLuxCore</h1><p>Blender용 물리 기반 렌더러. CPU와 Apple Metal을 포함한 GPU 경로를 제공합니다.</p><p><a href="manual/install.html">설치</a> · <a href="manual/index.html">사용 설명서</a> · <a href="https://github.com/claudianus/SuperBlendLuxCore/releases">배포 목록</a></p><h2>Cycles 장면과 검증</h2><p>기존 장면의 재질과 설정을 변환하며 지원 범위를 계속 확장하고 있습니다. 모든 장면의 영상 일치나 99% 호환성이 검증된 상태는 아닙니다.</p><p><a href="manual/cycles-import.html">2.11.13의 변경과 남은 제한</a></p></main></body></html>
